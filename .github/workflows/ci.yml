name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-core:
    name: iOS core logic (Swift tests on Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: ios/scripts/test-core.sh

  ios:
    name: iOS app (build + unit tests)
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Sonora.xcodeproj -scheme Sonora
      - name: Build and test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -Eo 'iPhone 1[0-9]( Pro)? \(' | head -1 | sed 's/ ($//')
          echo "Using simulator: $DEVICE"
          set -o pipefail
          xcodebuild test \
            -project Sonora.xcodeproj \
            -scheme Sonora \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unre|Test Case .* (passed|failed)|\*\* (BUILD|TEST)" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log

  database:
    name: Database migrations + flow tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: setup.sql is up to date with the migrations
        run: python3 ../scripts/build_setup.py && git diff --exit-code -- ../setup.sql

  edge-functions:
    name: Edge functions (type check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes deno@2 check */index.ts
      - run: npx --yes deno@2 test _shared/

  admin:
    name: Admin dashboard (type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build
