name: Sonora
options:
  bundleIdPrefix: com.sonora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.20.0
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm
    from: 24.0.0

targets:
  Sonora:
    type: application
    platform: iOS
    sources:
      - path: Sonora
      - path: ../legal
        type: folder
        buildPhase: resources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Stripe
        product: StripePaymentSheet
    info:
      path: Sonora/Info.plist
      properties:
        CFBundleDisplayName: EasySesh
        CFBundleLocalizations: [en, da, de, pl, el, fr, es, it, sv, nl]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: EasySesh uses your location to show recording studios near you and the distance to them.
        NSPhotoLibraryUsageDescription: Choose photos for your artist or studio profile.
        NSCalendarsWriteOnlyAccessUsageDescription: Add your booked sessions to your calendar.
        NSCameraUsageDescription: Take photos for your artist or studio profile.
        UIBackgroundModes: [remote-notification]
        LSApplicationQueriesSchemes: [comgooglemaps]
        CFBundleURLTypes:
          - CFBundleURLName: com.sonora.app
            CFBundleURLSchemes: [sonora]
        SonoraSupabaseURL: $(SONORA_SUPABASE_URL)
        SonoraSupabaseAnonKey: $(SONORA_SUPABASE_ANON_KEY)
        SonoraStripePublishableKey: $(SONORA_STRIPE_PUBLISHABLE_KEY)
        SonoraApplePayMerchantId: $(SONORA_APPLE_PAY_MERCHANT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sonora.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Debug builds run with a free (personal) Apple team: no Sign in with Apple,
        # Apple Pay or push entitlements. Release uses Sonora.entitlements (paid team).
        Release:
          CODE_SIGN_ENTITLEMENTS: Sonora/Sonora.entitlements

  SonoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SonoraTests
    dependencies:
      - target: Sonora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sonora:
    build:
      targets:
        Sonora: all
        SonoraTests: [test]
    test:
      targets: [SonoraTests]
